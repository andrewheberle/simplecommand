# golangci-lint configuration, used by both modules in this repository
# (golangci-lint searches parent directories for this file).
version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - gocritic
    - misspell
    - nolintlint
    - revive
    - unconvert
    - usestdlibvars
  settings:
    misspell:
      locale: UK
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      enable-default-rules: true
      rules:
        # methods implementing simplecobra.Commander must accept parameters
        # they may not use
        - name: unused-parameter
          disabled: true

formatters:
  enable:
    - gofmt
    - goimports
