name: Run tests and upload coverage

on: 
  push

jobs:
  test:
    name: Run tests and collect coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'

      - name: Install dependencies
        run: go mod download

      - name: Install vipercommand dependencies
        working-directory: vipercommand
        run: go mod download

      - name: Run vet
        run: go vet ./...

      - name: Run vipercommand vet
        working-directory: vipercommand
        run: go vet ./...

      - name: Run tests
        run: go test -race -coverprofile=coverage.txt ./...

      - name: Run vipercommand tests
        working-directory: vipercommand
        run: go test -race -coverprofile=../coverage-vipercommand.txt ./...

      - name: Upload results to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: andrewheberle/simplecommand
          files: ./coverage.txt,./coverage-vipercommand.txt

      # vipercommand normally builds against the published simplecommand, so
      # also test it against the local copy to catch breaking changes before
      # a new simplecommand release
      - name: Run vipercommand tests against local simplecommand
        working-directory: vipercommand
        env:
          GOWORK: ${{ runner.temp }}/go.work
        run: |
          go work init "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/vipercommand"
          go vet ./...
          go test -race ./...
